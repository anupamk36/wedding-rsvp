<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Birthday invitation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#FFF9F0}
a{text-decoration:none}
button,input{font-family:'DM Sans',system-ui,sans-serif}
.seg{flex:1;min-width:0;height:48px;border-radius:12px;border:1.5px solid #DCC9AE;background:#FFFFFF;color:#2B1A0C;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg.a{background:#92400E;border-color:#92400E;color:#fff}
.seg.m{background:#5A4D4B;border-color:#5A4D4B;color:#fff}
.seg.n{background:#3A2E30;border-color:#3A2E30;color:#fff}
.seg.a::before,.seg.m::before,.seg.n::before{content:'✓';font-weight:700}
.chip{height:44px;padding:0 14px;border-radius:999px;border:1.5px solid #DCC9AE;background:#fff;color:#2B1A0C;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#FDF0DC;border-color:#92400E;color:#6B2F08;font-weight:700}
.chip.on::before{content:'✓'}
.field{box-sizing:border-box;width:100%;height:48px;border-radius:12px;border:1.5px solid #DCC9AE;background:#fff;padding:0 14px;font-size:15px;color:#2B1A0C}
.seg:focus-visible,.chip:focus-visible,.field:focus-visible,.go:focus-visible{outline:2px solid #92400E;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:960px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFF9F0;color:#2B1A0C;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden">

  <!-- Cover: oversized numeral -->
  <div style="position:relative;background:#FDF0DC;padding:36px 24px 28px;overflow:hidden;border-bottom:1px solid #EBD9BC">
    <div aria-hidden="true" style="position:absolute;right:-6px;top:-36px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:200px;line-height:1;letter-spacing:-0.04em;color:#F3D9A8">30</div>
    <div style="position:relative;display:flex;flex-direction:column;gap:10px">
      <span style="align-self:flex-start;display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:#92400E;color:#fff;font-size:13px;font-weight:700">Birthday · Dear Meera</span>
      <p style="margin:64px 0 0;font-size:14px;color:#5C3A1E">Aarav's friends invite you to</p>
      <h1 style="margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:38px;line-height:1.05;letter-spacing:-0.02em;max-width:260px">Aarav turns thirty</h1>
      <p style="margin:6px 0 0;font-size:16px;font-weight:600">Sat 5 December · 5:00 PM</p>
      <p style="margin:0;font-size:14px;color:#5C3A1E">Terrace at Bandra, Mumbai</p>
    </div>
  </div>

  <div style="flex:1;padding:22px 20px 0;display:flex;flex-direction:column;gap:18px;overflow:hidden">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:13px;font-weight:600;color:#7A5A3A">Step 1 of 2 · Reply by Sat 28 Nov</span>
      <h2 style="margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px;line-height:1.15">Can you make it?</h2>
    </div>

    <div role="group" aria-label="Birthday party" style="display:flex;gap:6px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
        <button type="button" class="seg {{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{coming}}" hint-placeholder-val="{{ true }}">
      <section style="background:#fff;border:1px solid #EBD9BC;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
          <h3 style="margin:0;font-size:16px;font-weight:700">Bringing someone?</h3>
          <span style="font-size:13px;color:#7A5A3A">1 guest allowed</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="plus" style="font-size:13.5px;font-weight:600">Their name</label>
          <input id="plus" class="field" type="text" value="Kabir Shah">
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <span id="diet-l" style="font-size:13.5px;font-weight:600">Food preferences, for you both</span>
          <div role="group" aria-labelledby="diet-l" style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
              <button type="button" class="chip {{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button>
            </sc-for>
          </div>
        </div>
      </section>
    </sc-if>
  </div>

  <div style="padding:12px 20px 20px;background:#fff;border-top:1px solid #EBD9BC;display:flex;flex-direction:column;gap:8px">
    <a class="go" href="Event-Birthday.dc.html" style="display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:14px;background:#92400E;color:#fff;font-size:16px;font-weight:600">Send my reply</a>
    <p style="margin:0;text-align:center;font-size:13px;color:#7A5A3A">One reply covers you and your guest</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { v: 'a', diet: ['Vegetarian'] };
}
renderVals() {
const opts = [['a', 'Attending'], ['m', 'Maybe'], ['n', 'Not attending']];
const tags = ['Vegetarian', 'Vegan', 'Jain', 'Gluten free', 'Nut allergy'];
return {
coming: this.state.v !== 'n',
opts: opts.map(([c, label]) => ({ label, cls: this.state.v === c ? c : '', pressed: this.state.v === c, pick: () => this.setState({ v: c }) })),
chips: tags.map((label) => {
const on = this.state.diet.includes(label);
return { label, cls: on ? 'on' : '', pressed: on, pick: () => this.setState((s) => ({ diet: on ? s.diet.filter((x) => x !== label) : [...s.diet, label] })) };
})
};
}
}
</script>
</body>
</html>
