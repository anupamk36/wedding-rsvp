# Gatherly stack. Requires a .env file (cp .env.example .env).
#
#   docker compose up -d --build --wait     db + migrations + web app + email worker
#   docker compose run --rm migrate npm run db:seed
#   docker compose up dev                   hot-reloading dev server instead of `app`
#   docker compose down                     stop (add -v to delete the database volume)

name: gatherly

x-tools-build: &tools-build
  context: .
  target: tools

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-gatherly}:${POSTGRES_PASSWORD:-gatherly}@db:5432/${POSTGRES_DB:-gatherly}
  APP_URL: ${APP_URL:-http://localhost:3000}
  APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env (see .env.example)}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  CRON_SECRET: ${CRON_SECRET:-}
  RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gatherly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatherly}
      POSTGRES_DB: ${POSTGRES_DB:-gatherly}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies pending migrations, then exits. app/worker wait for it.
  migrate:
    build: *tools-build
    image: gatherly-tools:local
    command: ["npm", "run", "db:migrate"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    image: gatherly-app:local
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Sends queued emails every minute (retries and backoff are handled in the job queue).
  worker:
    build: *tools-build
    image: gatherly-tools:local
    command: ["sh", "-c", "while :; do npm run -s jobs:notifications || true; sleep 60; done"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Development server with hot reload; run with `docker compose up dev`.
  dev:
    profiles: [dev]
    build: *tools-build
    image: gatherly-tools:local
    command: ["npx", "next", "dev", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      <<: *app-env
      NODE_ENV: development
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
